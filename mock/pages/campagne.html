<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campagne</title>
  <link rel="stylesheet" href="../design/tokens.css">
  <link rel="stylesheet" href="../kit/kit.css">
  <link rel="stylesheet" href="../mock.css">
</head>
<body>
  <nav data-el="site-menu" aria-label="Sections">
    <a data-el="menu-campagnes" data-link="campagnes" href="campagnes.html">Campagnes</a>
    <a data-el="menu-medias" data-link="medias" href="medias.html">Médias</a>
    <a data-el="menu-soundbox" data-link="soundbox" href="soundbox.html">Soundbox</a>
    <a data-el="menu-parametres-ia" data-link="parametres-ia" href="parametres-ia.html">Paramètres IA</a>
  </nav>
  <main data-page="campagne">
    <nav class="kit-breadcrumb" data-kit="Breadcrumb" aria-label="Fil d’Ariane"><ol><li><a data-el="crumb-campagnes" data-link="campagnes" href="campagnes.html">Campagnes</a></li></ol></nav>
    <div data-el="campaign-overview" data-component="campaign.campaignOverview" data-props='{"title":"En chiffres"}'></div>
    <div class="kit-stack" data-kit="Stack" data-list="campaign_overview_view" data-where="campaign_id={{selected.campaign_overview_view}}">
      <template>
    <section class="kit-section" data-kit="Section">
      <div class="head"><h2>Préparer et jouer</h2><p class="hint">Les séances, les éléments de la campagne et ce qui reste à créer.</p></div>
      <div class="body">
    <ul class="kit-card-grid" data-kit="CardGrid">
      <li class="cell"><article class="kit-card" data-kit="Card" data-el="session-list">
        <div class="body"><h3>Séances</h3><p>Préparez la prochaine séance ou lancez-la en direct.</p></div>
        <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="primary" data-el="session-list-create-session" data-action="session.createSession">Créer une séance</button><button type="button" class="secondary" data-el="session-list-to-preparation-seance" data-link="preparation-seance">Préparer</button><button type="button" class="secondary" data-el="session-list-to-dm-view" data-link="dm-view">Jouer</button></div></div>
      </article></li>
      <li class="cell"><article class="kit-card" data-kit="Card" data-el="campaign-elements">
        <div class="body"><h3>Éléments de la campagne</h3><p>Joueurs, personnages, lieux, événements, médias et sons, à portée de main.</p></div>
        <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="secondary" data-el="campaign-elements-to-fiche-entite" data-link="fiche-entite">Fiches</button><button type="button" class="secondary" data-el="campaign-elements-to-medias" data-link="medias">Médias</button><button type="button" class="secondary" data-el="campaign-elements-to-soundbox" data-link="soundbox">Sons</button></div></div>
      </article></li>
      <li class="cell"><article class="kit-card" data-kit="Card" data-el="to-create-list">
        <div class="body"><h3>À créer</h3><p>Les PNJ, lieux et événements cités dans vos briefs, prêts à devenir des fiches.</p></div>
        <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="primary" data-el="to-create-list-create-from-brief" data-action="ai.createFromBrief">Créer depuis le brief</button></div></div>
      </article></li>
      <li class="cell"><article class="kit-card" data-kit="Card" data-el="note-import">
        <div class="body"><h3>Import de notes</h3><p>Collez ou dictez vos notes : l’IA en tire les éléments, vous validez en lot.</p></div>
        <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="primary" data-el="note-import-extract-from-notes" data-action="ai.extractFromNotes">Extraire des notes</button><button type="button" class="secondary" data-el="note-import-create-entities-from-note" data-action="campaign.createEntitiesFromNote">Créer la sélection</button></div></div>
      </article></li>
    </ul>
      </div>
    </section>
      </template>
    </div>
  </main>
</body>
</html>
