<div class="kit-stack" data-kit="Stack">
  <header class="kit-page-header" data-kit="PageHeader">
    <div class="titles"><h1>Vos campagnes</h1><p class="lead">Choisissez une campagne ou un oneshot pour le préparer ou le jouer.</p></div>
    <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="ghost" data-el="campaign-to-import" data-link="nouvelle-campagne">Importer une archive</button><button type="button" class="primary" data-el="campaign-new" data-link="nouvelle-campagne">Nouvelle campagne</button></div></div>
  </header>
  <section class="kit-section" data-kit="Section">
      <div class="head"><h2>Bibliothèque</h2><p class="hint">{{hint}}</p></div>
      <div class="body">
        <div class="kit-datatable" data-kit="DataTable">
          <div class="tools">
            <input type="search" placeholder="Rechercher par nom" aria-label="Rechercher une campagne" data-el="campaign-search" name="campaign-search">
            <select aria-label="Filtrer par type" data-el="campaign-filter" name="campaign-filter"><option value="">Campagnes et oneshots</option><option>Campagne</option><option>Oneshot</option></select>
          </div>
          <div class="scroll">
            <table>
              <thead><tr><th aria-sort="ascending"><button type="button">Nom</button></th><th aria-sort="none"><button type="button">Type</button></th><th class="num" aria-sort="none"><button type="button">Séances</button></th><th aria-sort="none"><button type="button">Dernier export</button></th><th>Actions</th></tr></thead>
              <tbody data-el="campaign-cards" data-list="campaign_overview_view" data-empty="Aucune campagne pour l’instant : cliquez sur « Nouvelle campagne » en haut de la page pour créer la première, ou importez une archive.">
                <template>
                  <tr>
                    <td><strong>{{name}}</strong></td>
                    <td><div class="kit-badge" data-kit="Badge"><span class="accent">{{kind_label}}</span></div></td>
                    <td class="num">{{session_count}}</td>
                    <td>{{last_export_label}}</td>
                    <td><div class="kit-button" data-kit="Button"><button type="button" class="ghost" data-el="campaign-open" data-link="campagne">Ouvrir</button><button type="button" class="ghost" data-el="campaign-export" data-action="campaign.exportCampaign">Exporter</button></div></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="pager"><span class="count" data-el="campaign-count">Triées par nom, 20 par page</span><span><button type="button">Précédent</button> <button type="button">Suivant</button></span></div>
        </div>
      </div>
    </section>
</div>
