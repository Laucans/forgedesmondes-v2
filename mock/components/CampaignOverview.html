<div class="kit-stack" data-kit="Stack" data-el="overview-campaign" data-list="campaign_overview_view" data-where="campaign_id={{selected.campaign_overview_view}}">
  <template>
    <div class="kit-stack" data-kit="Stack">
      <header class="kit-page-header" data-kit="PageHeader">
        <div class="titles"><h1>{{name}}</h1><p class="lead">{{pitch}}</p></div>
        <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="primary" data-el="overview-export" data-action="campaign.exportCampaign">Exporter l’archive</button></div></div>
      </header>
      <div class="kit-columns" data-kit="Columns">
        <div class="pane main">
          <section class="kit-section" data-kit="Section">
            <div class="head"><h2>{{title}}</h2><p class="hint">Ce que contient la campagne.</p></div>
            <div class="body">
              <table class="kit-table" data-kit="Table" data-el="overview-counts">
                <thead><tr><th>Élément</th><th class="num">Nombre</th></tr></thead>
                <tbody>
                  <tr><td>Joueurs</td><td class="num">{{player_count}}</td></tr>
                  <tr><td>Personnages joueurs</td><td class="num">{{pc_count}}</td></tr>
                  <tr><td>PNJ</td><td class="num">{{npc_count}}</td></tr>
                  <tr><td>Lieux</td><td class="num">{{place_count}}</td></tr>
                  <tr><td>Événements</td><td class="num">{{event_count}}</td></tr>
                  <tr><td>Médias</td><td class="num">{{media_count}}</td></tr>
                  <tr><td>Sons</td><td class="num">{{sound_count}}</td></tr>
                  <tr><td>Séances</td><td class="num">{{session_count}}</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
        <aside class="pane side">
          <div class="kit-stack" data-kit="Stack">
            <article class="kit-card" data-kit="Card">
              <div class="media"><div class="kit-imageplaceholder" data-kit="ImagePlaceholder" role="img" aria-label="Couverture de {{name}}"><span class="initials">{{glyph}}</span><img src="{{cover_url}}" alt=""></div></div>
            </article>
            <section class="kit-section" data-kit="Section">
              <div class="head"><h2>Archive</h2><p class="hint">L’export télécharge tout ce que contient la campagne.</p></div>
              <div class="body"><div class="kit-badge" data-kit="Badge"><span data-el="overview-last-export">Dernier export : {{last_export_label}}</span></div></div>
            </section>
          </div>
        </aside>
      </div>
    </div>
  </template>
  <template data-empty>
    <div class="kit-emptystate" data-kit="EmptyState"><div class="icon">✦</div><h3>Aucune campagne ouverte</h3><p>Choisissez une campagne dans la liste pour voir son tableau de bord.</p><button type="button" data-el="overview-back" data-link="campagnes">Choisir une campagne</button></div>
  </template>
</div>
