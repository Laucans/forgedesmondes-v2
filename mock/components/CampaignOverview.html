<div class="kit-stack" data-kit="Stack" data-el="overview-campaign" data-list="campaign_overview_view" data-where="campaign_id={{selected.campaign_overview_view}}" data-empty="Aucune campagne ouverte. Revenez aux campagnes pour en choisir une.">
  <template>
    <div class="kit-stack" data-kit="Stack">
      <header class="kit-page-header" data-kit="PageHeader">
        <div class="titles"><h1>{{name}}</h1><p class="lead">{{pitch}}</p></div>
        <div class="actions"><div class="kit-badge" data-kit="Badge"><span class="accent">{{kind_label}}</span></div><div class="kit-button" data-kit="Button"><button type="button" class="primary" data-el="overview-export" data-action="campaign.exportCampaign">Exporter l’archive</button></div></div>
      </header>
      <div class="kit-columns" data-kit="Columns">
        <div class="pane main">
          <section class="kit-section" data-kit="Section">
            <div class="head"><h2>{{title}}</h2><p class="hint">Ce que contient la campagne.</p></div>
            <div class="body">
              <table class="kit-table" data-kit="Table" data-el="overview-counts">
                <thead><tr><th>Élément</th><th class="num">Nombre</th></tr></thead>
                <tbody>
                  <tr><td>Joueurs</td><td class="num">{{player_count}}</td></tr>
                  <tr><td>Personnages joueurs</td><td class="num">{{pc_count}}</td></tr>
                  <tr><td>PNJ</td><td class="num">{{npc_count}}</td></tr>
                  <tr><td>Lieux</td><td class="num">{{place_count}}</td></tr>
                  <tr><td>Événements</td><td class="num">{{event_count}}</td></tr>
                  <tr><td>Médias</td><td class="num">{{media_count}}</td></tr>
                  <tr><td>Sons</td><td class="num">{{sound_count}}</td></tr>
                  <tr><td>Séances</td><td class="num">{{session_count}}</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
        <aside class="pane side">
          <article class="kit-card" data-kit="Card">
            <div class="media"><div class="kit-imageplaceholder" data-kit="ImagePlaceholder" role="img" aria-label="Couverture de {{name}}"><span class="initials">{{glyph}}</span></div></div>
            <div class="body"><h3>Archive</h3><p data-el="overview-last-export">Dernier export : {{last_export_label}}</p></div>
            <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="ghost" data-el="overview-to-preparation" data-link="preparation-seance">Préparer la prochaine séance</button><button type="button" class="ghost" data-el="overview-to-dm-view" data-link="dm-view">Ouvrir la DM view</button></div></div>
          </article>
        </aside>
      </div>
    </div>
  </template>
</div>
