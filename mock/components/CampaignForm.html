<div class="kit-columns" data-kit="Columns">
      <div class="pane main"><article class="kit-card" data-kit="Card" data-form>
        <div class="body">
          <h3>Nouvelle campagne</h3>
          <p>Un oneshot est une campagne d’une seule séance, créée avec elle.</p>
          <div class="kit-input" data-kit="Input"><label>Nom<input type="text" data-el="campaign-new-name" name="campaign-new-name" placeholder="Le Val Maudit"><small>Obligatoire.</small></label></div>
          <div class="kit-textarea" data-kit="TextArea"><label class="kit-textarea__label" for="campaign-new-pitch">Accroche</label><textarea class="kit-textarea__field" id="campaign-new-pitch" data-el="campaign-new-pitch"></textarea><div class="kit-textarea__footer"><p class="kit-textarea__hint">Une ou deux phrases, facultatives.</p></div></div>
          <div class="kit-checkbox" data-kit="Checkbox"><fieldset><legend>Format</legend><label><input type="checkbox" data-el="campaign-new-oneshot" name="campaign-new-oneshot"><span>Oneshot (une seule séance)</span></label></fieldset></div>
        </div>
        <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="primary" data-el="campaign-create" data-action="campaign.createCampaign" data-link="campagnes">Créer la campagne</button></div></div>
      </article></div>
      <aside class="pane side"><article class="kit-card" data-kit="Card" data-form>
        <div class="body">
          <h3>Importer une archive</h3>
          <p>Crée toujours une nouvelle copie ; la campagne d’origine n’est pas modifiée.</p>
          <div class="kit-filedrop" data-kit="FileDrop"><label class="kit-filedrop__zone"><span class="kit-filedrop__title">Déposez l’archive ou <b>parcourez</b></span><span class="kit-filedrop__types"><span class="kit-filedrop__tag">.zip</span></span><input class="kit-filedrop__input" type="file" accept=".zip" data-el="campaign-archive" name="campaign-archive"></label></div>
        </div>
        <div class="actions"><div class="kit-button" data-kit="Button"><button type="button" class="secondary" data-el="campaign-import" data-action="campaign.importCampaign" data-link="campagnes">Importer en nouvelle campagne</button></div></div>
      </article></aside>
    </div>
