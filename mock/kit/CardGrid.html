<!-- CardGrid: a responsive grid of cards or tiles. Put its class on a list (ul data-list) or a div; each child is a cell, a Card fills its cell and keeps the only frame. -->
<style>
.kit-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--size-card, 280px)), 1fr)); gap: var(--space-4, 24px); list-style: none; margin: 0; padding: 0; font-family: var(--font-family, system-ui, sans-serif); }
.kit-card-grid > * { min-width: 0; }
.kit-card-grid > .kit-card, .kit-card-grid > li > .kit-card { height: 100%; max-width: none; }
.kit-card-grid > .cell { background: var(--color-surface, #120a1c); color: var(--color-text, #f5ecf7); border: var(--border-width, 1px) solid var(--color-border, #3d2b57); border-radius: var(--radius-medium, 12px); padding: var(--space-3, 16px); }
.kit-card-grid > .cell:has(.kit-card), .kit-card-grid > .cell:has([data-kit]) { background: none; border: 0; border-radius: 0; padding: 0; }
</style>
<ul class="kit-card-grid">
  <li class="cell">First tile</li>
  <li class="cell">Second tile</li>
  <li class="cell">Third tile</li>
  <li class="cell">Fourth tile</li>
</ul>
