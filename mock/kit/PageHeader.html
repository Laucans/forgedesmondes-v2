<!-- PageHeader: the top of a page: its title (the only display-face text of the page), a lead sentence, its main actions (one primary Button) on the right, under the title on a phone. -->
<style>
.kit-page-header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3, 16px); padding-bottom: var(--space-3, 16px); border-bottom: var(--border-width, 1px) solid var(--color-border, #3d2b57); font-family: var(--font-family, system-ui, sans-serif); color: var(--color-text, #f5ecf7); }
.kit-page-header .titles { display: flex; flex-direction: column; gap: var(--space-1, 4px); min-width: 0; flex: 1 1 18rem; }
.kit-page-header h1 { margin: 0; font-family: var(--font-family-heading, Impact, sans-serif); font-size: var(--font-size-heading, 2rem); font-weight: var(--font-weight-heading, 700); letter-spacing: 0; line-height: 1.1; overflow-wrap: anywhere; }
.kit-page-header .lead { margin: 0; color: var(--color-text-muted, #b9a6c9); font-size: var(--font-size-base, 1rem); }
.kit-page-header .actions { display: flex; flex-wrap: wrap; gap: var(--space-2, 8px); }
@media (max-width: 600px) { .kit-page-header { align-items: flex-start; } .kit-page-header .actions { width: 100%; } }
</style>
<header class="kit-page-header">
  <div class="titles"><h1>Page title</h1><p class="lead">One sentence that says what this page is for.</p></div>
  <div class="actions"><span>Actions</span></div>
</header>
